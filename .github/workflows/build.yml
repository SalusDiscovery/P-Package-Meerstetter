name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-tag version on push to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --tags --force

          # 1. Manual Override: if already tagged at HEAD, do nothing
          ALREADY_TAGGED=$(git tag --points-at HEAD)
          if [ -n "$ALREADY_TAGGED" ]; then
            echo "Commit already tagged as $ALREADY_TAGGED. Skipping auto-tag."
            exit 0
          fi

          # 2. Find latest tag (or default to v0.0.0)
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi

          VER="${LATEST_TAG#v}"
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3 | cut -d- -f1)

          # 3. Check commit message for bump keywords
          COMMIT_MSG=$(git log -1 --pretty=%B)

          if echo "$COMMIT_MSG" | grep -iqE "(#major|BREAKING CHANGE)"; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif echo "$COMMIT_MSG" | grep -iqE "(#minor|^feat(\(.*\))?:)"; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping tag: $LATEST_TAG -> $NEW_TAG"

          git tag -a "$NEW_TAG" -m "Release $NEW_TAG [skip ci]"
          git push origin "$NEW_TAG"

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          cache-dependency-glob: "pyproject.toml"

      - run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          name: dist-tagged
          path: dist/
          retention-days: 90
